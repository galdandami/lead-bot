name: Keep alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS -o /dev/null -w "%{http_code}" "${{ secrets.LEAD_BOT_URL }}/" || true
      - name: Ping Supabase API
        run: curl -fsS -o /dev/null -w "%{http_code}" "https://udozteluyreuhfdgjiqq.supabase.co/rest/v1/" || true